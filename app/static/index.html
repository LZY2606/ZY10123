<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LiDAR 航带校正工作台</title>
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
<header>
  <div>
    <h1>LiDAR 航带刚体 / 偏移 / 缓变漂移试验</h1>
    <p>源坐标、坐标系和长度单位只读；每次修改都会派生新方案。</p>
  </div>
  <div class="dataset-picker">
    <label>数据集 <select id="datasetSelect"></select></label>
    <button id="refreshButton">刷新</button>
  </div>
</header>
<main>
  <section class="panel controls-panel">
    <h2>新方案约束</h2>
    <div class="form-grid">
      <label>作业 ID <input id="jobId" /></label>
      <label>方案名称 <input id="schemeLabel" /></label>
      <label>模型
        <select id="modelSelect">
          <option value="rigid_v1">rigid_v1：全局刚体</option>
          <option value="strip_offset_v1">strip_offset_v1：分段平移</option>
          <option value="drift_v1">drift_v1：分段缓变漂移</option>
        </select>
      </label>
      <label>父方案（可选）<select id="parentSelect"><option value=""></option></select></label>
      <label>拒识阈值 m（可空）<input id="residualLimit" type="number" step="0.01" placeholder="例如 0.25" /></label>
      <label>航带二分时间（留空为一段）<div id="splitInputs" class="split-inputs"></div></label>
    </div>
    <h3>控制点</h3>
    <div class="evidence-list" id="controlList"></div>
    <h3>重叠航带对应</h3>
    <div class="evidence-list" id="correspondenceList"></div>
    <div class="button-row">
      <button id="solveButton" class="primary">派生方案</button>
      <button id="publishButton">发布当前方案</button>
      <span id="solveStatus" class="status"></span>
    </div>
    <pre id="diagnostics" class="diagnostics"></pre>
  </section>

  <section class="panel viewer-panel">
    <div class="compare-row">
      <label>方案 A <select id="leftScheme"></select></label>
      <label>方案 B <select id="rightScheme"></select></label>
    </div>
    <div id="schemeGrid" class="scheme-grid"></div>
  </section>
</main>
<template id="schemeTemplate">
  <article class="scheme-card">
    <div class="card-head"><h3></h3><span class="badge"></span></div>
    <dl class="meta"></dl>
    <div class="charts">
      <div><h4>平面图 x-y</h4><svg class="plan" viewBox="0 0 280 220"></svg></div>
      <div><h4>高程剖面 x-z</h4><svg class="profile" viewBox="0 0 280 160"></svg></div>
      <div><h4>残差分布</h4><svg class="histogram" viewBox="0 0 280 140"></svg></div>
    </div>
    <h4>残差证据</h4>
    <div class="residual-table"></div>
  </article>
</template>
<script src="/static/app.js"></script>
</body>
</html>
